# Builds the invitations from the bundled example data and runs every check.
# No secrets, no deployment, nothing is uploaded.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    name: Build on examples (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Repository hygiene (no tracked media, no tracked build output)
        run: |
          set -euo pipefail
          # Names are read NUL-separated and unquoted, so non-ASCII names are matched as is.
          tracked() {
            git -c core.quotePath=false ls-files -z -- "$@" | tr '\0' '\n'
          }
          names="$(git -c core.quotePath=false ls-files -z | tr -cd '\0' | wc -c)"
          lines="$(tracked | wc -l)"
          returns="$(tracked | grep -ac $'\r' || true)"
          if [ "$names" -ne "$lines" ] || [ "$returns" -ne 0 ]; then
            echo "Tracked file names must not contain line breaks or carriage returns" >&2
            exit 1
          fi
          # Every tracked file is checked: the repository carries no media at all.
          media="$(tracked | grep -aEi '\.(png|jpe?g|webp|gif|avif|mp4|mov|webm|ico|svg)$' || true)"
          if [ -n "$media" ]; then
            echo "Media files must not be tracked:" >&2
            echo "$media" >&2
            exit 1
          fi
          output="$(tracked dist examples/media)"
          if [ -n "$output" ]; then
            echo "Generated files must not be tracked:" >&2
            echo "$output" >&2
            exit 1
          fi
          echo "OK: no tracked media or build output"

      - name: Ensure Chrome is available
        run: |
          set -euo pipefail
          # the build renders the link preview image with the browser of the runner,
          # and the unit tests with a real browser use it too: it must start headless
          # as this user, with its sandbox, as the build starts it
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "Chrome is not installed on the runner" >&2
            exit 1
          fi
          google-chrome --version
          profile="$(mktemp -d "$RUNNER_TEMP/chrome-profile.XXXXXX")"
          status=0
          timeout 60 google-chrome --headless=new --disable-gpu --no-first-run \
            --user-data-dir="$profile" --dump-dom about:blank >/dev/null 2>"$RUNNER_TEMP/chrome.log" \
            || status=$?
          if [ "$status" -ne 0 ]; then
            if [ "$status" -eq 124 ]; then
              echo "Chrome did not answer within 60 s (a hang, not a crash):" >&2
            else
              echo "Chrome does not start headless (exit code $status):" >&2
            fi
            tail -n 20 "$RUNNER_TEMP/chrome.log" >&2
            exit 1
          fi
          rm -rf "$profile"
          echo "OK: Chrome starts headless"

      - name: Unit tests
        run: |
          set -euo pipefail
          python -m unittest

      - name: Ensure ffmpeg is available
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | sed -n 1p

      - name: Generate example media
        run: |
          set -euo pipefail
          python tools/gen_example_media.py

      - name: Validate and build the main example set
        env:
          SITE_NAME: Example
        run: |
          set -euo pipefail
          python build.py validate
          # the link to the menu leads to a directory of the fictional site, not built here
          python build.py build --allow-path /menu --out "$RUNNER_TEMP/dist"

      - name: Validate and build the set without a venue and media
        run: |
          set -euo pipefail
          python build.py validate --data examples/data-venue-pending --media examples/media-none
          python build.py build --data examples/data-venue-pending --media examples/media-none --out "$RUNNER_TEMP/dist-pending"

      - name: Build the main example set under a base path
        env:
          SITE_NAME: Example
        run: |
          set -euo pipefail
          # the layout a real site uses: the invitations in a directory of the site
          python build.py build --base-path /invite --allow-path /menu --out "$RUNNER_TEMP/site/invite"

      - name: Link preview tags
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/dist" / "$RUNNER_TEMP/site/invite" /invite <<'PY'
          import re, sys
          from pathlib import Path
          meta = re.compile(r'<meta (?:property|name)="([^"]+)" content="([^"]*)"')
          for out, base in zip(map(Path, sys.argv[1::2]), sys.argv[2::2]):
              prefix = base.rstrip("/")
              pages = sorted(page for page in out.glob("*/index.html") if page.parent.name != "assets")
              assert pages, "no invitation page was built"
              images = set()
              for page in pages:
                  tags = dict(meta.findall(page.read_text(encoding="utf-8")))
                  assert re.fullmatch(re.escape(prefix) + r"/assets/[A-Za-z0-9_-]+/[0-9a-f]{16}\.jpg", tags.get("og:image", "")), "og:image is not the rendered cover in the media directory"
                  images.add(tags["og:image"])
                  assert "og:url" not in tags, "og:url must not be written"
                  assert tags.get("og:site_name") == "Example", "og:site_name is not the SITE_NAME of the build"
                  assert tags.get("og:title", "").startswith("Приглашение · "), "og:title has no names"
                  assert tags.get("og:description"), "no og:description"
                  for key, value in tags.items():
                      assert "://" not in value, f"an absolute URL in <meta {key}>"
              assert len(images) == 1, "the pages refer to different link preview images"
              image = (out / images.pop()[len(prefix) + 1:]).read_bytes()
              assert image[:3] == b"\xff\xd8\xff", "the link preview image is not a JPEG"
              assert len(image) <= 300 * 1024, "the link preview image is larger than 300 KB"
              sof = image.find(b"\xff\xc0")
              size = (int.from_bytes(image[sof + 7:sof + 9], "big"), int.from_bytes(image[sof + 5:sof + 7], "big"))
              assert size == (1200, 630), f"the link preview image is {size[0]}x{size[1]}"
              assert not list(out.glob("assets/og.*")), "a link preview image at assets/og.*"
              print(f"OK: link preview tags of {len(pages)} page(s) under {base}")
          PY

      - name: Check the built invitations
        run: |
          set -euo pipefail
          check_out() {
            local data="$1" out="$2" extra expected actual name
            # the files of the site around the invitations are not written by the build
            for name in index.html 404.html _headers robots.txt; do
              if [ -e "$out/$name" ]; then
                echo "$name must not be written to $out" >&2
                return 1
              fi
            done
            extra="$(find "$out" \( -iname '*.json' -o -iname '*.map' -o -iname 'styleguide*' -o -iname 'preview.*' \) -print)"
            if [ -n "$extra" ]; then
              echo "Files that must not be published:" >&2
              echo "$extra" >&2
              return 1
            fi
            expected="$(python -c 'import json, sys; print(len(json.load(open(sys.argv[1], encoding="utf-8"))))' "$data/invitations.json")"
            actual="$(find "$out" -mindepth 2 -maxdepth 2 -type f -name index.html -not -path "$out/assets/*" | wc -l | tr -d '[:space:]')"
            if [ "$expected" != "$actual" ]; then
              echo "Expected $expected page(s) in $out, found $actual" >&2
              return 1
            fi
            echo "OK: $out ($actual page(s))"
          }
          check_out examples/data "$RUNNER_TEMP/dist"
          check_out examples/data-venue-pending "$RUNNER_TEMP/dist-pending"
          check_out examples/data "$RUNNER_TEMP/site/invite"

      - name: Reproducible build
        env:
          SITE_NAME: Example
        run: |
          set -euo pipefail
          python build.py build --allow-path /menu --out "$RUNNER_TEMP/dist2"
          tree_hash() {
            (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum)
          }
          tree_hash "$RUNNER_TEMP/dist" > "$RUNNER_TEMP/dist.sha256"
          tree_hash "$RUNNER_TEMP/dist2" > "$RUNNER_TEMP/dist2.sha256"
          test -s "$RUNNER_TEMP/dist.sha256"
          diff "$RUNNER_TEMP/dist.sha256" "$RUNNER_TEMP/dist2.sha256"
          echo "OK: two builds are identical"

      - name: Working tree stays clean
        run: |
          set -euo pipefail
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "The build left untracked or modified files:" >&2
            echo "$status" >&2
            exit 1
          fi
          echo "OK: working tree is clean"
